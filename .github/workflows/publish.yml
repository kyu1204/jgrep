name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0"
        required: true

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm Trusted Publishing (OIDC), no token secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: bun install --frozen-lockfile
      - run: bun test src/
      - run: bun run build
      - name: Verify CLI works
        run: node dist/jgrep.js --version
      - name: Verify tag matches package version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          test "v$(node -p 'require("./package.json").version')" = "$TAG" || { echo "package.json version != $TAG"; exit 1; }
      - run: npm publish --provenance --access public
      - name: GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
